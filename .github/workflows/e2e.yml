# E2E nachts und auf Zuruf (Plan 87-03).
#
# Die Playwright-Specs laufen seriell gegen Vite + Express (`npm run dev`, von
# Playwright gestartet) und teilen sich das Projekt „Review Testhaus“ in
# server/db.json — das Global-Setup (87-01) zwingt das Haus auf 70 × 16 m und
# stellt es nach jedem Test per API wieder her. server/db.json ist gitignored: der
# Seed legt die Demo-Projekte an, das Global-Setup das Testhaus aus
# tests/e2e/fixtures/testhaus-record.json (B-87-05). Lokal NICHT seeden, solange
# der Server läuft — er hält die DB im Speicher.
#
# Barrierefreiheit (93-02): tests/e2e/axe-93-02.spec.js läuft hier mit (WCAG 2.1 AA über
# alle Modulseiten, rot nur bei neuen Verstößen gegen tests/e2e/axe-basis.json). Ohne
# die devDependency @axe-core/playwright überspringt sie sich — siehe
# docs/BARRIEREFREIHEIT-PRUEFUNG.md.
#
# Laufzeit (31.10.2026): der letzte grüne Lauf (24.10., 223 passed / 104 skipped)
# brauchte 35,5 min bei einem Job-Limit von 40. Seitdem sind die Specs der Phasen
# 106 und 107 dazu (~19 min allein die Dateien vor form-86-02) und dieselben alten
# Specs liefen 1,43× langsamer. Der Nachtlauf 41185652431 wurde nicht von einem
# hängenden Spec abgebrochen, sondern vom Job-Timeout, mitten in form-86-03, nach
# Test 132. Vier Shards teilen die Dateien (Playwright lässt eine Datei beisammen).
# Jeder Job hat eigenen Checkout, eigenen Dev-Server und eigene db.json — die
# Testhaus-Serialität gilt weiter innerhalb eines Shards. Der Heap des Dev-Servers
# steht in playwright.config.js (dieselbe 4-GB-Grenze wie vite build in gates.yml).
name: E2E

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 04:30 MESZ, nach den Nachtläufen
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium

      - name: Demo-Daten (frische DB)
        run: npm run seed

      - name: E2E
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Report sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
