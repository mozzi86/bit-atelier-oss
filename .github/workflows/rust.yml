# Gate of the Rust workspace rust/ (plan 117 §4.6, sub-plan 117-02).
#
# This file holds NO logic of its own: checkout, toolchain, the two tools, Linux packages for eframe,
# then the one command `cargo xtask pruefen --ci` (fmt, clippy, kopf, test, schichten, wasm, lizenz
# incl. advisories, assets, dritte, datenschutz). As long as GitHub Actions does not start for this
# account, the local run is the gate (report under .planning/phases/117-rust-fundament/pruefung/).
name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "design/bit-atelier-tokens.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "design/bit-atelier-tokens.json"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: cargo xtask pruefen --ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Third-party actions only with a fixed commit (actions/checkout v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner; rust/rust-toolchain.toml pins version, components and
      # the wasm32 target.
      - name: Toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo-deny and cargo-nextest (fixed versions)
        run: |
          cargo install cargo-deny --version 0.21.0 --locked
          cargo install cargo-nextest --version 0.9.152 --locked

      - name: Linux packages for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: cargo xtask pruefen --ci
        working-directory: rust
        run: cargo xtask pruefen --ci
