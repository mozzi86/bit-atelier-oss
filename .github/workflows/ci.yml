# CI: lint, unit tests and a production build on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      # 93-09: fails when the client build grows past budget.json (gzip bytes; raise only deliberately with --schreiben).
      - name: Size budget
        run: node scripts/groessen-budget.mjs
      # 92-08: visible on every push, but not blocking — a new advisory must not turn unrelated commits red.
      # The release workflow runs the same audit as a hard gate.
      - name: Audit runtime packages (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
