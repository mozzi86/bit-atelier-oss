# Gates auf jedem Push und Pull Request (Plan 87-03; Größen-Budget seit 93-09).
#
# Bis hierhin liefen Lint, Unit-Tests, Build und Typecheck nur auf dem Rechner des
# Owners bzw. in den Nacht-Agenten — „Gates grün“ war ein Selbstbericht. Dieser
# Workflow macht die vier Gates aus CLAUDE.md („Definition of Done“) zu einem
# Status, den jeder Commit auf GitHub bekommt. Die Sperrliste (keine echten
# Projekt-/Kundennamen, tests/unit/projektneutral.test.js) läuft als Teil der
# Unit-Tests über die Hash-Datei im Repo — die Klartextliste wird nicht gebraucht.
#
# E2E (Playwright, vier Shards, nachts) läuft getrennt: .github/workflows/e2e.yml.
name: Gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint · Unit · Build · tsc-Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit-Tests (inkl. Sperrliste und i18n-Abdeckung)
        run: npm run test:unit

      # Node 22 caps the V8 old space at about 2 GB. Rendering chunks aborts with
      # exit 134 ("Ineffective mark-compacts near heap limit") once the CSG graph
      # is part of this build (since 107-09). Runners have 7 GB; 4 GB is enough.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npx vite build > build.log 2>&1; EXIT=$?
          tail -n 30 build.log
          exit $EXIT

      # 93-09: the build may not grow past budget.json (gzip bytes of entry, CSS, vendor, first paint,
      # largest route, named chunks). Raising a limit is a deliberate commit: --schreiben.
      - name: Größen-Budget
        run: node scripts/groessen-budget.mjs

      # 107-14: the lazy CSG chunk is not emitted by the app build until 107-09 calls the core (groessen-budget reports
      # "fehlt chunks.csg", no failure); a small measuring build checks it against budget.json chunks.csg meanwhile.
      # 107-18: the same build also checks the WebAssembly binary of manifold-3d against budget.json assets.manifold.
      - name: Größen-Budget csg-Chunk
        run: node scripts/csg-chunk-budget.mjs

      - name: tsc-Baseline (Fehlerzahl darf nicht steigen)
        run: node scripts/tsc-baseline.mjs --je-datei

      # 2026-10-13: hardcoded colour classes may only go down (token migration). Lowering
      # the baseline is a deliberate commit: node scripts/farb-baseline.mjs --schreiben.
      - name: Farb-Baseline (feste Farbklassen dürfen nicht steigen)
        run: node scripts/farb-baseline.mjs
