# Release: a tag v* builds the client once and publishes BIT-Atelier.zip.
# The zip contains the full source plus the prebuilt dist/, so the start scripts only run
# `npm ci --omit=dev` on the user's machine. The asset name is version-free on purpose:
# the website links to releases/latest/download/BIT-Atelier.zip.
# 92-04: the release notes are the CHANGELOG.md section of the tagged version (tools/changelog-abschnitt.mjs),
# the install instructions follow as a second paragraph below a marker the in-app update banner cuts at.
# A tag without its CHANGELOG section stops before anything is built.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Changelog section of this version
        run: node tools/changelog-abschnitt.mjs "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install
        run: npm ci --no-audit --no-fund

      # 92-08 (lever Nr. 146): the zip makes every user's machine run `npm ci --omit=dev` from this lock
      # file — no release ships a runtime package with a known high or critical advisory.
      - name: Audit runtime packages
        run: npm audit --omit=dev --audit-level=high

      - name: Gates
        run: |
          npm run lint
          npm run test:unit

      - name: Build the client
        run: npm run build

      # 93-09: no release ships a client that grew past budget.json.
      - name: Size budget
        run: node scripts/groessen-budget.mjs

      - name: Assemble BIT-Atelier.zip
        run: |
          set -euo pipefail
          rm -rf staging && mkdir -p staging
          git archive --format=tar --prefix=BIT-Atelier/ HEAD | tar -x -C staging
          cp -r dist staging/BIT-Atelier/dist
          chmod +x staging/BIT-Atelier/start.sh
          (cd staging && zip -qr ../BIT-Atelier.zip BIT-Atelier)
          # 92-01/02: the in-app updater and the installers refuse a zip without this checksum file.
          sha256sum BIT-Atelier.zip > BIT-Atelier.zip.sha256
          cp installer/BIT-Atelier-Installer.cmd installer/install.sh .
          ls -l BIT-Atelier.zip BIT-Atelier.zip.sha256 BIT-Atelier-Installer.cmd install.sh

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          node tools/changelog-abschnitt.mjs "${GITHUB_REF_NAME#v}" > notes.md
          # The marker line must stay exactly like NOTIZ_MARKE in server/selbstUpdate.js.
          cat >> notes.md <<'EOF'

          <!-- bit-atelier:installation -->
          ---

          **Installation**

          - **Windows:** download `BIT-Atelier-Installer.cmd` and double-click it (installs to your user folder, creates shortcuts, no admin rights). Deutsch: Installer herunterladen und doppelklicken.
          - **macOS / Linux:** `curl -fsSL https://github.com/mozzi86/bit-atelier-oss/releases/latest/download/install.sh | sh`
          - **Manual / von Hand:** unzip `BIT-Atelier.zip` and start `start-windows.cmd` or `./start.sh`.
          - Requires **Node.js 22.9 or newer**. An installed app shows new versions and updates itself from inside the app.
          - **Uninstall / Entfernen:** Start menu → BIT-Atelier entfernen, or `BIT-Atelier-Installer.cmd /entfernen`; macOS/Linux `sh ~/BIT-Atelier/installer/install.sh --entfernen`.
          EOF
          printf -- '- SHA-256 of BIT-Atelier.zip: `%s`\n\nUse at your own risk — see LICENSE.\n' "$(cut -d' ' -f1 BIT-Atelier.zip.sha256)" >> notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-pushed tag replaces its release (and the old zip) instead of failing.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" BIT-Atelier.zip BIT-Atelier.zip.sha256 BIT-Atelier-Installer.cmd install.sh \
            --title "BIT-Atelier $GITHUB_REF_NAME" \
            --notes-file notes.md

  # 94-09 (register 171, user decision 16.10.2026): the Tauri desktop client (serverless "lokal"
  # build in its own window, client/) is built on Windows and attached to the SAME release as
  # BIT-Atelier-Desktop-Setup.exe (+ .sha256). Runs after the main job so a failed desktop
  # build never blocks the zip; the release notes only mention the desktop app once it exists.
  # Rust and the MSVC tools are preinstalled on windows-latest — no extra action needed.
  # Unsigned: Windows SmartScreen asks once ("More info" → "Run anyway").
  desktop:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustc --version

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the desktop installer
        run: npm run client:build

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem client/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer found under client/src-tauri/target/release/bundle/nsis" }
          Copy-Item $exe.FullName BIT-Atelier-Desktop-Setup.exe
          $hash = (Get-FileHash BIT-Atelier-Desktop-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BIT-Atelier-Desktop-Setup.exe" | Out-File -Encoding ascii BIT-Atelier-Desktop-Setup.exe.sha256
          gh release upload "$env:GITHUB_REF_NAME" BIT-Atelier-Desktop-Setup.exe BIT-Atelier-Desktop-Setup.exe.sha256 --clobber
          $notes = gh release view "$env:GITHUB_REF_NAME" --json body --jq .body
          $zeile = "- **Desktop app (Windows, preview):** ``BIT-Atelier-Desktop-Setup.exe`` — the app in its own window without Node.js, data in a folder you choose; unsigned (SmartScreen: More info → Run anyway). SHA-256: ``$hash``"
          ($notes + "`n" + $zeile) | Out-File -Encoding utf8 notes-desktop.md
          gh release edit "$env:GITHUB_REF_NAME" --notes-file notes-desktop.md
