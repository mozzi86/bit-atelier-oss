# Atelier AI Harness — behaviour configuration.
# Copy to config.yaml and adjust. Secrets never go here: API keys live in .env only.

# developer = "BIT Atelier Developer Harness" (repo access, git, shell with approval)
# user      = "Atelier AI Harness"           (project workspace only, allowlist shell)
mode: user

# Provider profile name from providers.yaml and the model to start with.
provider: mock
model: null            # null = default_model of the profile

# Local service (HTTP + WebSocket). Never bind to anything but 127.0.0.1.
host: 127.0.0.1
port: 8765

# Workspaces: projects/<slug>/PROJECT.md, memory/, tasks.md, files/, model/
projects_dir: projects
project: efh-satteldach
# The app repository — only reachable in developer mode. Default: parent of harness/.
repo_root: null

# Memory budget inside the system prompt (characters); the rest is listed as an index.
memory_budget_chars: 2200
# Every N turns the harness appends a short reminder to save lasting facts.
memory_nudge_every: 10

agent:
  max_rounds: 20         # tool-calling rounds per user turn before the loop stops
  max_tokens: 4096

shell:
  # Read-only commands run without asking. Everything else shows the command,
  # one sentence of explanation and waits for "ja". Blocklist is hard-coded.
  allowlist:
    - git status
    - git log
    - git diff
    - ls
    - dir
    - cat
    - type
    - rg
    - grep
    - find
    - python --version
    - node --version
    - npm ls
  # Read ONCE at start-up and frozen. Ignored in user mode. Prompt injection cannot flip it.
  yolo: false
  timeout_s: 120

# Speech (67-05). Needs the extra: pip install -e ".[voice]". Audio stays in memory.
stt:
  enabled: true
  model: small          # tiny | base | small | medium | large-v3 — [ASSUMED] small: Diktatqualität vs. Tempo
  language: de
tts:
  enabled: false        # Piper, local; voice file under harness/voices/<name>.onnx
  voice: de_DE-thorsten-medium

# FreeCAD BIM (67-04, /freecad). FreeCAD brings its own Python — scripts run
# with freecadcmd, never with the harness venv. Lookup order for the binary:
#   1. environment variable BIT_FREECAD (path to freecadcmd or to the install folder)
#   2. freecad.cmd below
#   3. default: Windows C:\Program Files\FreeCAD 1.1\bin\freecadcmd.exe,
#      macOS /Applications/FreeCAD.app/Contents/MacOS/FreeCADCmd, else freecadcmd on PATH
freecad:
  cmd: null
  bridge_port: 8766     # GUI bridge macro (harness_bridge.FCMacro), 127.0.0.1 only
  timeout_s: 120        # headless run; one bridge step times out after 30 s

# IFC delivery export (71-05, /ifc schreibe abgabe=true). Project-specific values
# belong in projects/<slug>/georef.yaml (same keys), which wins over this block.
# drehung_grad: angle from grid east to the project x axis, counter-clockwise.
ifc:
  georef: null          # {ostwert: m, nordwert: m, hoehe: m, drehung_grad: °, crs: "EPSG:…"}

# Connection to the BIT-Atelier app's MCP server (106-05, speech profile). The harness starts `node tools/mcp-server.mjs --schreiben`
# when the first spoken sentence that the app's grammar did not understand arrives, and offers the model a SMALL allowlist of its tools:
# proposals (eigenschaft_setzen, transformieren, teilen), reads (auswahl_abfragen, vorschlaege_lesen, pruefen), vorschlag_verwerfen.
# Never offered, whatever this file says: anything that confirms, changes records, sends an image or picks another element than the
# selected one. Needs Node >= 22 and a running app (api_url). A change is only a proposal - the person confirms in the app.
mcp:
  enabled: true
  command: node
  script: null          # default: tools/mcp-server.mjs under repo_root
  api_url: null         # BIT_API_URL of the MCP server; default http://127.0.0.1:3001/api
  timeout_s: 60
  # tools: [auswahl_abfragen, vorschlaege_lesen, pruefen, eigenschaft_setzen, transformieren, teilen, vorschlag_verwerfen]

logs_dir: logs
